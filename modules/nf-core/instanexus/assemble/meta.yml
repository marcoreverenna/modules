# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "instanexus_assemble"
description: |
  Assemble de novo peptide sequences from a filtered peptide-spectrum match (PSM)
  table into protein scaffolds with the InstaNexus assembly stage. The assembly
  algorithm (e.g. de Bruijn graph or greedy overlap) and its k-mer, overlap and
  scaffold length settings are selected through `ext.args`.
keywords:
  - proteomics
  - de novo protein sequencing
  - assembly
  - de bruijn graph
  - peptides
  - scaffolds
tools:
  - "instanexus":
      description: "Generalizable direct protein sequencing with InstaNexus."
      homepage: "https://github.com/Multiomics-Analytics-Group/InstaNexus"
      documentation: "https://github.com/Multiomics-Analytics-Group/InstaNexus"
      tool_dev_url: "https://github.com/Multiomics-Analytics-Group/InstaNexus"
      doi: "10.1016/j.mcpro.2026.101547"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - csv:
        type: file
        description: |
          Filtered PSM table, e.g. as produced by the InstaNexus preprocessing
          stage. Must contain a `cleaned_preds` column with the peptide sequences.
        pattern: "*.csv"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV

output:
  scaffolds:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.scaffolds.fasta":
          type: file
          description: Assembled protein scaffold sequences
          pattern: "*.scaffolds.fasta"
          ontologies:
            - edam: "http://edamontology.org/format_1929" # FASTA
  versions_instanexus:
    - - ${task.process}:
          type: string
          description: The name of the process
      - instanexus:
          type: string
          description: The name of the tool
      - python -c "import importlib.metadata as m; print(m.version('instanexus'))":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - instanexus:
          type: string
          description: The name of the tool
      - python -c "import importlib.metadata as m; print(m.version('instanexus'))":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@marcoreverenna"
maintainers:
  - "@marcoreverenna"
